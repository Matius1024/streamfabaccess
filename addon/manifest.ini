name = streamFabDostep
summary = "StreamFab dostęp"
description = """Poprawia dostępność programu StreamFab z NVDA: nadaje nazwy nieopisanym przyciskom, ogłasza stan pobierania i nowe okna, czyta fokus w menu My Account, pozwala naciskać przyciski okien niedostępne klawiszem Tab, daje listę pobranych filmów, a w oknie pobierania serialu poprawnie czyta odcinki (z czasem trwania), ogłasza zaznaczenie Spacją i podaje polskie nazwy list i języków audio; listy Język audio i Napisy są czytane jako listy rozwijane z wybranymi językami po polsku (a nie jako pole tylko do odczytu). Obsługuje okno logowania i przenosi klawiaturę do okna Licencja, na które czeka logowanie. Skróty w StreamFab: Ctrl+Shift+D pobierz wideo, Ctrl+Shift+S stan pobierania, Ctrl+L pole adresu, Ctrl+Shift+L lista pobranych filmów, Ctrl+Shift+O OK, Ctrl+Shift+C Anuluj, Ctrl+Shift+strzałki przyciski okna, Ctrl+Shift+Enter naciśnij wybrany, Ctrl+Shift+R czytaj okno, Ctrl+Shift+W kolejne okno, Ctrl+Shift+A ogłaszanie, Ctrl+Shift+H pomoc."""
