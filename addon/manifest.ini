name = streamFabDostep
summary = "StreamFab dostęp"
description = """Poprawia dostępność programu StreamFab z NVDA: nadaje nazwy nieopisanym przyciskom, ogłasza stan pobierania i nowe okna, czyta fokus w menu My Account, pozwala naciskać przyciski okien niedostępne klawiszem Tab, daje listę pobranych filmów i kolejkę pobierania z tytułami i stanem, ogłasza zakończenie lub błąd pobierania, a w oknie pobierania serialu poprawnie czyta odcinki (z czasem trwania), ogłasza zaznaczenie Spacją i podaje polskie nazwy list i języków audio; listy Język audio i Napisy są czytane jako listy rozwijane z wybranymi językami po polsku (a nie jako pole tylko do odczytu). Obsługuje okno logowania i przenosi klawiaturę do okna Licencja, na które czeka logowanie. Skróty w StreamFab: Ctrl+Shift+D pobierz wideo, Ctrl+Shift+S stan pobierania, Ctrl+L pole adresu, Ctrl+Shift+L lista pobranych filmów, Ctrl+Shift+K kolejka pobierania, Ctrl+Shift+O OK, Ctrl+Shift+C Anuluj, Ctrl+Shift+strzałka w prawo lub w lewo przyciski okna, Ctrl+Shift+Enter naciśnij wybrany, Ctrl+Shift+R czytaj okno, Ctrl+Shift+W kolejne okno, Ctrl+Shift+A ogłaszanie, Ctrl+Shift+H pomoc; w otwartym oknie StreamFab dodatek obsługuje też Tab, Shift+Tab, strzałki w górę i w dół, Spację i Escape, a na listach języków Enter, Alt+strzałkę w dół i F4. Dodatkowo czyta i nazywa okno aktualizacji StreamFab (StreamUpdate.exe) ze skrótami Ctrl+Shift+R, U lub O, P, C, I (Co nowego w oknie do czytania strzałkami), M, B, A i H oraz własnym cyklem Tab i Shift+Tab, w którym Enter lub Spacja wykonuje akcję bieżącego elementu. Wszystkie skróty mają polskie opisy i można je zmienić w NVDA, Ustawienia, Zdarzenia wejścia, w kategorii StreamFab dostęp."""
